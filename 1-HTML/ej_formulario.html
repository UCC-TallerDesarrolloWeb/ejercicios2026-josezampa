<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>

<body>
    <!--Cree un Formulario con los campos que se proponen a continuacion-->
    <!--Agregue el atributo legend-->

    <!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

    <h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>
    <form name="form_suscripcion">
        <p>
            <label for="nombre">Nombre: </label><input type="text" name="apellido" placeholder="Ingrese nombre" id="nombre">
        </p>
        <p>
            <label for="apellido">Apellido: </label><input type="text" name="nombre" placeholder="Ingrese apellido" id="apellido">
        </p>
        <p>
            Sexo:
            <label for="masculino">Masculino: </label> <input type="radio" name="sex" value="masculino" id="masculino">
            <label for="femenino">Femenino: </label> <input type="radio" name="sex" value="femenino" id="femenino">
        </p>
        <p>
            <label for="edad">Edad: </label><input type="number" name="edad" placeholder="Ingrese edad" id="edad">
        </p>
        <p>
            <label for="email">Email: </label><input type="email" name="email" placeholder="usuario@dominio.com" id="email">
        </p>
        <p>
            <label for="usuario">Usuario: </label><input type="text" name="usuario" placeholder="Nombre de usuario" id="usuario">
        </p>
        <p>
            <label for="passaword">Password: </label><input type="password" name="contraseña" placeholder="Ingrese contraseña" id="password">
        </p>
        <p>
            <label for="confirmar-pass">Confirmar password: </label><input type="password" name="segunda_contraseña" placeholder="Confirme constraseña" id="confirmar-pass">
        </p>

        <p>
            Tipo de servicio:
            <select name="tipo_servicio">
                <option value="Free">Free</option>
                <option value="Standard">Standard</option>
                <option value="Premium">Premium</option>
            </select>
        </p>
        <p>
            Tema:
            Política <input type="checkbox" value="Política">
            Negocios <input type="checkbox" value="Negocios">
            Tecnología <input type="checkbox" value="Tecnología">
            Salud <input type="checkbox" value="Salud">
        </p>
        <p>
            <label for="comentario">Agregue un comentario:</label>
            <textarea id="comenatrio">Deje su comentario...</textarea>
        </p>
        <p>
            <button type="button" id="boton-enviar"><label for="boton-enviar">Enviar</label></button>
        </p>        
    </form>

</body>

</html>
