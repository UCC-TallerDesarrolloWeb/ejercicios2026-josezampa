<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <title>youtube</title>

    <style>
        .card img{
            width: 35rem;
        }
        .col-2 img{
            width: 3rem;
        }
        .action-buttons{
            height: 0;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .card{
            transform: scale(1);
            transition: scale 0.2s ease;
        }
        .card:hover{
            transform: scale(1.1);
            z-index: 100;
        }
        .card:hover .action-buttons{
            height: auto;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container my-5 d-flex gap-1">
        <div class="card text-white text-bg-dark border-0">
            <a href="" class="text-light text-decoration-none">
                <img src="imagenes/fondo.avif" alt="portada video" class="card-image-top">
            </a>
            <div class="card-body">
                <div class="row">
                    <div class="col-2">
                        <a href="">
                        <img src="../2-CSS/imagenes/icono_usuario.jpg" alt="foto perfil" class="rounded-circle">
                        </a>
                    </div>

                    <div class="col-10">
                        <div class="card-title">
                            <a href="" class="test-light text-decoration-none">
                                video tutorial muy famoso
                            </a>
                        </div>
                        <div class="card-title">
                            <a href="" class="test-light text-decoration-none opacity-50">
                                descripcion delvideo
                            </a>
                        </div>
                        <div class="text-light opacity-50">1M vistas - 1 dia</div>
                    </div>
                </div>

                <div class="row action-buttons p-2 overflow-hidden">
                    <div class="col-6 p-1">
                        <a href="" class="btn btn-secondary w-100 fw-bold d-block fs-6">
                            VER MAS TARDE
                        </a>
                    </div>
                    <div class="col-6 p-1">
                        <a href="" class="btn btn-secondary w-100 fw-bold d-block fs-6">
                            GUARDAR EN LISTA
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
