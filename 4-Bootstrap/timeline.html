<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <title>timeline</title>
</head>
<body>
    <div class="container border mt-5">
        <div class="row text-center bg-black text-white">
            <div class="col-6">
                <div class="row">
                    <div class="col fw-bold p-2">enero</div>
                </div>

                <div class="row">
                    <div class="col-3 border border-light">semana 1</div>
                    <div class="col-3 border border-light">semana 2</div>
                    <div class="col-3 border border-light">semana 3</div>
                    <div class="col-3 border border-light">semana 4</div>
                </div>
            </div>

            <div class="col-6">
                <div class="row">
                    <div class="col fw-bold p-2">febrero</div>
                </div>

                <div class="row">
                    <div class="col-3 border border-light">semana 1</div>
                    <div class="col-3 border border-light">semana 2</div>
                    <div class="col-3 border border-light">semana 3</div>
                    <div class="col-3 border border-light">semana 4</div>
                </div>
            </div>
        </div>

        <div class="row p-4">
            <div class="row py-2">
                <div class="item col-5 rounded-2 bg-secondary text-white p-2">
                    <div class="row">
                        <div class="col-10">
                            <div class="status fs-6 text-info">completada</div>
                            <div class="title fw-bold fs-5">definir arquitectura</div>
                            <div class="date opacity-50 fs-6">20 de enero</div>
                        </div>

                        <div class="col-2 d-flex align-items-center gap-1 p-1">
                            <img src="../2-CSS/imagenes/icono_usuario.jpg" alt="foto usuario" class="rounded-circle border" width="32">
                            <img src="../2-CSS/imagenes/icono_usuario.jpg" alt="foto usuario" class="rounded-circle border" width="32">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row p-4">
            <div class="row py-2">
                <div class="col-3"></div>
                <div class="item col-5 rounded-2 bg-secondary text-white p-2">
                    <div class="row">
                        <div class="col-10">
                            <div class="status fs-6 text-warning">en progreso</div>
                            <div class="title fw-bold fs-5">definir arquitectura</div>
                            <div class="date opacity-50 fs-6">20 de enero</div>
                        </div>

                        <div class="col-2 d-flex align-items-center gap-1 p-1">
                            <img src="../2-CSS/imagenes/icono_usuario.jpg" alt="foto usuario" class="rounded-circle border" width="32">
                            <img src="../2-CSS/imagenes/icono_usuario.jpg" alt="foto usuario" class="rounded-circle border" width="32">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row p-4">
            <div class="row py-2">
                <div class="col-6"></div>
                <div class="item col-5 rounded-2 bg-secondary text-white p-2">
                    <div class="row">
                        <div class="col-10">
                            <div class="status fs-6 text-danger">bloqueada</div>
                            <div class="title fw-bold fs-5">definir arquitectura</div>
                            <div class="date opacity-50 fs-6">20 de enero</div>
                        </div>

                        <div class="col-2 d-flex align-items-center gap-1 p-1">
                            <img src="../2-CSS/imagenes/icono_usuario.jpg" alt="foto usuario" class="rounded-circle border" width="32">
                            <img src="../2-CSS/imagenes/icono_usuario.jpg" alt="foto usuario" class="rounded-circle border" width="32">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</html>
